<div id="vivid-weather-study">
  <style>
    #vivid-weather-study .vw-controls {
      margin-bottom: 18px;
      padding-right: 90px;
    }
    #vivid-weather-study .vw-stage {
      padding: 24px 12px;
    }
    #vivid-weather-study .vw-screen {
      --vw-top: light-dark(#064bcc, #06296f);
      --vw-middle: light-dark(#0865df, #084baa);
      --vw-bottom: light-dark(#6bd6ff, #169adb);
      --vw-glass: light-dark(rgb(255 255 255 / 0.72), rgb(7 27 59 / 0.72));
      --vw-glass-solid: light-dark(#e7f3ff, #112c52);
      --vw-glass-edge: light-dark(
        rgb(255 255 255 / 0.7),
        rgb(200 231 255 / 0.28)
      );
      --vw-text: light-dark(#0a2b52, #f5faff);
      --vw-muted: light-dark(#1c3c61, #d8e9fc);
      --vw-action: light-dark(#083877, #ffffff);
      --vw-line: light-dark(rgb(9 55 109 / 0.15), rgb(225 241 255 / 0.22));
      --vw-hero-text: #ffffff;
      --vw-hero-muted: #f0f6ff;
      --vw-shadow: rgb(0 29 89 / 0.12);
      --vw-blur: 24px;
      max-width: 390px;
      margin: 0 auto;
      overflow: hidden;
      isolation: isolate;
      border-radius: 24px;
      background: linear-gradient(
        180deg,
        var(--vw-top) 0%,
        var(--vw-middle) 58%,
        var(--vw-bottom) 100%
      );
      color: var(--vw-hero-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    #vivid-weather-study .vw-screen * {
      box-sizing: border-box;
    }
    #vivid-weather-study .vw-hero {
      padding: 26px 26px 32px;
    }
    #vivid-weather-study .vw-location {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 500;
    }
    #vivid-weather-study .vw-location svg {
      width: 17px;
      height: 17px;
    }
    #vivid-weather-study .vw-updated {
      margin: 4px 0 0 25px;
      color: var(--vw-hero-muted);
      font-size: 12px;
    }
    #vivid-weather-study .vw-current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 28px;
    }
    #vivid-weather-study .vw-temperature {
      font-size: 80px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -4px;
    }
    #vivid-weather-study .vw-condition {
      font-size: 18px;
      margin-top: 12px;
    }
    #vivid-weather-study .vw-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }
    #vivid-weather-study .vw-icon svg {
      width: 100%;
      height: 100%;
      stroke-width: 1.5;
    }
    #vivid-weather-study .vw-range {
      margin-top: 10px;
      color: var(--vw-hero-muted);
      font-size: 13px;
    }
    #vivid-weather-study .vw-glass {
      position: relative;
      margin: 0 16px 16px;
      padding: 22px 20px;
      border: 1px solid var(--vw-glass-edge);
      border-radius: 18px;
      color: var(--vw-text);
      background: var(--vw-glass);
      -webkit-backdrop-filter: blur(var(--vw-blur));
      backdrop-filter: blur(var(--vw-blur));
      box-shadow: 0 5px 18px var(--vw-shadow);
    }
    #vivid-weather-study .vw-heading {
      margin: 0 0 19px;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 500;
    }
    #vivid-weather-study .vw-hours {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      text-align: center;
    }
    #vivid-weather-study .vw-hour {
      display: grid;
      justify-items: center;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }
    #vivid-weather-study .vw-hour time {
      color: var(--vw-muted);
      font-size: 12px;
    }
    #vivid-weather-study .vw-hour svg {
      width: 22px;
      height: 22px;
      color: var(--vw-action);
      stroke-width: 1.75;
    }
    #vivid-weather-study .vw-hour strong {
      font-size: 16px;
      font-weight: 500;
    }
    #vivid-weather-study .vw-forecast-button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 22px;
      padding: 17px 0 0;
      min-height: 44px;
      border: 0;
      border-top: 1px solid var(--vw-line);
      border-radius: 0;
      color: var(--vw-action);
      background: transparent;
      font: inherit;
      font-size: 14px;
      text-align: left;
    }
    #vivid-weather-study .vw-forecast-button svg {
      width: 17px;
      height: 17px;
      margin-left: auto;
    }
    #vivid-weather-study .vw-tomorrow {
      padding-top: 14px;
      color: var(--vw-muted);
      font-size: 13px;
    }
    #vivid-weather-study .vw-metrics {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    #vivid-weather-study .vw-metric {
      display: grid;
      gap: 4px;
    }
    #vivid-weather-study .vw-metric-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--vw-muted);
      font-size: 12px;
    }
    #vivid-weather-study .vw-metric-label svg {
      width: 15px;
      height: 15px;
    }
    #vivid-weather-study .vw-metric-value {
      font-size: 16px;
      font-weight: 500;
    }
    #vivid-weather-study .vw-caption {
      margin-top: 12px;
      text-align: center;
    }
    @media (max-width: 400px) {
      #vivid-weather-study .vw-stage {
        padding: 20px 4px;
      }
      #vivid-weather-study .vw-hero {
        padding: 24px 22px 30px;
      }
      #vivid-weather-study .vw-glass {
        margin-left: 12px;
        margin-right: 12px;
        padding-left: 17px;
        padding-right: 17px;
      }
      #vivid-weather-study .vw-temperature {
        font-size: 72px;
      }
    }
    @supports not (
      (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
    ) {
      #vivid-weather-study .vw-glass {
        background: var(--vw-glass-solid);
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      #vivid-weather-study .vw-glass {
        background: var(--vw-glass-solid);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }
  </style>

  <div class="viz-controls vw-controls">
    <label class="form-label"
      >Weather
      <select class="form-select" id="vw-weather">
        <option value="sunny">Sunny</option>
        <option value="cloudy">Cloudy</option>
        <option value="drizzle">Drizzle</option>
        <option value="rain">Rain</option>
        <option value="snow">Snow</option>
        <option value="fog">Fog</option>
        <option value="storm">Thunderstorm</option>
        <option value="night">Clear night</option>
      </select>
    </label>
    <label class="form-label"
      >Appearance
      <select class="form-select" id="vw-appearance">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>

  <div class="vw-stage viz-dotted-background">
    <article
      class="vw-screen"
      aria-label="Vivid weather with frosted glass panels"
    >
      <div class="vw-hero">
        <div class="vw-location">
          <i data-lucide="map-pin" aria-hidden="true"></i>Shanghai
        </div>
        <div class="vw-updated">Sample forecast</div>
        <div class="vw-current" aria-live="polite" aria-atomic="true">
          <div>
            <div class="vw-temperature" id="vw-temperature">24°</div>
            <div class="vw-condition" id="vw-condition">Sunny</div>
          </div>
          <span class="vw-icon" id="vw-icon"
            ><i data-lucide="sun" aria-hidden="true"></i
          ></span>
        </div>
        <div class="vw-range" id="vw-range">
          High 26° · Low 19° · Feels like 24°
        </div>
      </div>
      <section class="vw-glass" aria-label="Hourly forecast">
        <h3 class="vw-heading">Next hours</h3>
        <div class="vw-hours" id="vw-hours"></div>
        <button
          type="button"
          class="vw-forecast-button cursor-interaction"
          aria-expanded="false"
          aria-controls="vw-tomorrow"
        >
          <span>Tomorrow’s forecast</span
          ><i data-lucide="chevron-down" aria-hidden="true"></i>
        </button>
        <div class="vw-tomorrow" id="vw-tomorrow" hidden>
          Sunny · High 26° · Low 19°
        </div>
      </section>
      <section class="vw-glass vw-metrics" aria-label="Wind and humidity">
        <div class="vw-metric">
          <div class="vw-metric-label">
            <i data-lucide="wind" aria-hidden="true"></i>Wind
          </div>
          <div class="vw-metric-value" id="vw-wind">12 km/h</div>
        </div>
        <div class="vw-metric">
          <div class="vw-metric-label">
            <i data-lucide="droplets" aria-hidden="true"></i>Humidity
          </div>
          <div class="vw-metric-value" id="vw-humidity">54%</div>
        </div>
      </section>
    </article>
  </div>
  <div class="vw-caption text-small text-muted" id="vw-caption">
    Vivid sky · Frosted glass
  </div>

  <script>
    (() => {
      const root = document.getElementById('vivid-weather-study');
      const screen = root.querySelector('.vw-screen');
      const weatherInput = root.querySelector('#vw-weather');
      const appearanceInput = root.querySelector('#vw-appearance');
      const weatherThemes = {
        sunny: {
          label: 'Sunny',
          name: 'Vivid sky',
          icon: 'sun',
          light: ['#064BCC', '#0865DF', '#6BD6FF'],
          dark: ['#06296F', '#084BAA', '#169ADB'],
          temperature: 24,
          high: 26,
          low: 19,
          wind: 12,
          humidity: 54,
        },
        cloudy: {
          label: 'Cloudy',
          name: 'Cloud blue',
          icon: 'cloud',
          light: ['#345D8F', '#426C9A', '#B8D6EB'],
          dark: ['#162D51', '#2B507B', '#5484AE'],
          temperature: 21,
          high: 23,
          low: 18,
          wind: 14,
          humidity: 67,
        },
        drizzle: {
          label: 'Drizzle',
          name: 'Ocean blue',
          icon: 'cloud-drizzle',
          light: ['#005A73', '#076C81', '#78DAD6'],
          dark: ['#103B50', '#15576F', '#3FA4B3'],
          temperature: 19,
          high: 21,
          low: 17,
          wind: 9,
          humidity: 81,
        },
        rain: {
          label: 'Rain',
          name: 'Rain blue',
          icon: 'cloud-rain',
          light: ['#1147A3', '#215FB0', '#79BCEB'],
          dark: ['#102E65', '#214E91', '#3C93CE'],
          temperature: 18,
          high: 20,
          low: 16,
          wind: 18,
          humidity: 86,
        },
        snow: {
          label: 'Snow',
          name: 'Glacier blue',
          icon: 'snowflake',
          light: ['#285C91', '#326BA4', '#D4F1FF'],
          dark: ['#173E66', '#2A5A83', '#73B5D5'],
          temperature: -1,
          high: 1,
          low: -4,
          wind: 10,
          humidity: 78,
        },
        fog: {
          label: 'Fog',
          name: 'Mist blue',
          icon: 'cloud-fog',
          light: ['#465F79', '#536D87', '#C7D8E2'],
          dark: ['#263D53', '#3E5870', '#819EAD'],
          temperature: 16,
          high: 18,
          low: 14,
          wind: 4,
          humidity: 94,
        },
        storm: {
          label: 'Thunderstorm',
          name: 'Storm blue',
          icon: 'cloud-lightning',
          light: ['#203B76', '#3B548F', '#7D9ED3'],
          dark: ['#101D45', '#273769', '#526FA3'],
          temperature: 20,
          high: 23,
          low: 18,
          wind: 28,
          humidity: 83,
        },
        night: {
          label: 'Clear night',
          name: 'Midnight blue',
          icon: 'moon',
          light: ['#101F64', '#21458F', '#5586CE'],
          dark: ['#071437', '#10275E', '#28579D'],
          temperature: 19,
          high: 26,
          low: 17,
          wind: 7,
          humidity: 62,
        },
      };
      const state = { weather: 'sunny', appearance: 'system', expanded: false };
      const design = { opacity: 72, blur: 24 };

      function restore(saved) {
        const values = saved?.modelContent || {};
        if (Object.hasOwn(weatherThemes, values.weather))
          state.weather = values.weather;
        if (['system', 'light', 'dark'].includes(values.appearance))
          state.appearance = values.appearance;
        if (typeof values.glassOpacity === 'number')
          design.opacity = Math.max(60, Math.min(88, values.glassOpacity));
        if (typeof values.blur === 'number')
          design.blur = Math.max(12, Math.min(32, values.blur));
        if (typeof saved?.privateContent?.expanded === 'boolean')
          state.expanded = saved.privateContent.expanded;
      }

      function persist() {
        if (window.openai?.setWidgetState)
          window.openai
            .setWidgetState({
              modelContent: {
                weather: state.weather,
                appearance: state.appearance,
                palette: 'vivid-gradient',
                glassOpacity: design.opacity,
                blur: design.blur,
              },
              privateContent: { expanded: state.expanded },
            })
            .catch(() => {});
      }

      function render() {
        const theme = weatherThemes[state.weather];
        screen.style.colorScheme =
          state.appearance === 'system' ? '' : state.appearance;
        ['top', 'middle', 'bottom'].forEach((stop, index) =>
          screen.style.setProperty(
            `--vw-${stop}`,
            `light-dark(${theme.light[index]}, ${theme.dark[index]})`,
          ),
        );
        screen.style.setProperty(
          '--vw-glass',
          `light-dark(rgb(255 255 255 / ${design.opacity / 100}), rgb(7 27 59 / ${design.opacity / 100}))`,
        );
        screen.style.setProperty('--vw-blur', `${design.blur}px`);
        weatherInput.value = state.weather;
        appearanceInput.value = state.appearance;
        root.querySelector('#vw-temperature').textContent =
          `${theme.temperature}°`;
        root.querySelector('#vw-condition').textContent = theme.label;
        root.querySelector('#vw-icon').innerHTML =
          `<i data-lucide="${theme.icon}" aria-hidden="true"></i>`;
        root.querySelector('#vw-range').textContent =
          `High ${theme.high}° · Low ${theme.low}° · Feels like ${theme.temperature}°`;
        root.querySelector('#vw-hours').innerHTML = [0, 1, 2, 3]
          .map(
            (index) =>
              `<div class="vw-hour"><time>${index === 0 ? 'Now' : '+' + index + 'h'}</time><i data-lucide="${theme.icon}" aria-hidden="true"></i><strong>${theme.temperature + (index < 2 ? 0 : 1)}°</strong></div>`,
          )
          .join('');
        root.querySelector('#vw-tomorrow').textContent =
          `${theme.label} · High ${theme.high}° · Low ${theme.low}°`;
        root.querySelector('#vw-tomorrow').hidden = !state.expanded;
        root
          .querySelector('.vw-forecast-button')
          .setAttribute('aria-expanded', String(state.expanded));
        root.querySelector('#vw-wind').textContent = `${theme.wind} km/h`;
        root.querySelector('#vw-humidity').textContent = `${theme.humidity}%`;
        root.querySelector('#vw-caption').textContent =
          `${theme.name} · Frosted glass`;
        if (globalThis.lucide)
          lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      restore(window.openai?.widgetState);
      render();
      weatherInput.addEventListener('change', () => {
        state.weather = weatherInput.value;
        render();
        persist();
      });
      appearanceInput.addEventListener('change', () => {
        state.appearance = appearanceInput.value;
        render();
        persist();
      });
      root
        .querySelector('.vw-forecast-button')
        .addEventListener('click', () => {
          state.expanded = !state.expanded;
          render();
          persist();
        });
      window.addEventListener('openai:set_globals', (event) => {
        if (event.detail?.globals?.widgetState) {
          restore(event.detail.globals.widgetState);
          render();
        }
      });
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: screen, onChange: render });
        tweak.addSlider(design, 'opacity', {
          label: 'Glass opacity',
          min: 60,
          max: 88,
          step: 1,
          unit: '%',
          reference: '--vw-glass',
        });
        tweak.addSlider(design, 'blur', {
          label: 'Glass blur',
          min: 12,
          max: 32,
          step: 2,
          unit: 'px',
          reference: '--vw-blur',
        });
      }
    })();
  </script>
</div>
